# Konfigurasi Cloudflare Workers untuk Portal Glamora88.
name = "glamora88"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
# Jangan hapus variabel yang diatur lewat dashboard Cloudflare saat deploy otomatis
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cadangan data otomatis setiap hari pukul 00.00 WIB (17.00 UTC)
[triggers]
crons = ["0 17 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "glamora88-db"
database_id = "b73ebf2c-240c-41fb-b067-f42040639a64"
