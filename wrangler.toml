# Konfigurasi Cloudflare Workers untuk Portal Glamora88.
name = "glamora88"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "glamora88-db"
database_id = "b73ebf2c-240c-41fb-b067-f42040639a64"
